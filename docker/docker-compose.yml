# -----------------------------------------------------------------------------
# Distributed Task Scheduler — Docker Compose
# Services: PostgreSQL 16, Redis 7.2
# -----------------------------------------------------------------------------

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: task_scheduler_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-scheduler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheduler_secret}
      POSTGRES_DB: ${POSTGRES_DB:-task_scheduler}
      # Tune shared buffers and WAL for write-heavy workloads
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    command: >
      postgres
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c maintenance_work_mem=64MB
        -c checkpoint_completion_target=0.9
        -c wal_buffers=16MB
        -c default_statistics_target=100
        -c random_page_cost=1.1
        -c effective_io_concurrency=200
        -c work_mem=4MB
        -c max_connections=200
        -c log_min_duration_statement=500
        -c log_checkpoints=on
        -c log_connections=on
        -c log_lock_waits=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-scheduler} -d ${POSTGRES_DB:-task_scheduler}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - scheduler_net

  # ---------------------------------------------------------------------------
  # Redis 7.2 — AOF persistence, explicit memory ceiling
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7.2-alpine
    container_name: task_scheduler_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - scheduler_net

# -----------------------------------------------------------------------------
# Volumes & Networks
# -----------------------------------------------------------------------------

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  scheduler_net:
    driver: bridge
