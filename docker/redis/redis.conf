# -----------------------------------------------------------------------------
# Redis 7.2 Production Configuration
# Optimised for task-scheduler workloads: streams, sorted sets, Lua scripts
# -----------------------------------------------------------------------------

# -- Network ------------------------------------------------------------------
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# -- General ------------------------------------------------------------------
daemonize no
loglevel notice
databases 16

# -- Persistence: AOF (Append-Only File) --------------------------------------
# Use AOF for durability — every write is fsynced within one second
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-rewrite-incremental-fsync yes
aof-use-rdb-preamble yes

# -- Persistence: RDB (periodic snapshot for faster restarts) -----------------
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# -- Memory Management --------------------------------------------------------
# Cap at 512 MB; use allkeys-lru so cache-like data is evicted before streams
maxmemory 512mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# -- Slow Log -----------------------------------------------------------------
slowlog-log-slower-than 10000
slowlog-max-len 128

# -- Streams ------------------------------------------------------------------
# Cap each stream consumer group's PEL memory footprint
stream-node-max-bytes 4096
stream-node-max-entries 100

# -- Lua Script Timeout --------------------------------------------------------
# Atomic lock/unlock scripts must complete well under this limit
lua-time-limit 500

# -- Latency Monitoring -------------------------------------------------------
latency-monitor-threshold 100
latency-tracking yes

# -- Client Output Buffer -----------------------------------------------------
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit pubsub 32mb 8mb 60

# -- Active Expire & Lazy Free ------------------------------------------------
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
